$kind: http-request
url: "{{base_url}}/api/checkout"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cartId": "{{cart_id}}",
      "customerName": "Nguyen Van A",
      "address": "Hanoi, Vietnam"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 201 Created', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Sinh mã đơn hàng OrderID thành công', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.orderId).to.include('ORD_');
      });
    language: text/javascript
order: 3000
